<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>오늘의 일정 플래너</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app-container">
      <header class="app-header">
        <span id="todayDate" class="date-badge">오늘 일정</span>
        <h1 id="title">오늘의 할 일</h1>
        <p id="message">하루 일정을 적고 하나씩 해보아요!</p>
      </header>

      <section class="input-card">
        <div class="input-row">
          <input
            id="todoInput"
            type="text"
            placeholder="예: 14시 팀 미팅 준비, 장보기..."
            autocomplete="off"
          />
          <button id="addBtn" type="button" onclick="addTodo()">추가</button>
        </div>

        <div class="status-bar">
          <p id="todoCount" class="count-text">전체 0개 / 완료 0개</p>
          <div class="filter-group" role="group" aria-label="일정 필터">
            <button type="button" class="filter-btn active" data-filter="all">전체</button>
            <button type="button" class="filter-btn" data-filter="active">진행중</button>
            <button type="button" class="filter-btn" data-filter="completed">완료</button>
          </div>
        </div>
      </section>

      <section class="list-card">
        <ul id="todoList" class="todo-list">
          <li>JavaScript 공부하기</li>
          <li>과제 제출하기</li>
        </ul>
      </section>
    </main>

    <script src="./script.js"></script>
  </body>
</html>
